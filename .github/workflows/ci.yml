name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Install vite dependencies
        run: cd vite && npm ci

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Setup supabase services
        run: cd supabase && bash setup.sh

      - name: Run supabase tests
        run: cd supabase/tests && bash test-self-hosted.sh

      - name: Render diagrams
        run: npm run render:diagrams

      - name: Build
        run: npm run build

