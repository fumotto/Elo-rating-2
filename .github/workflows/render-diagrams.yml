name: Render Mermaid Diagrams
on:
  push:
    branches:
      - dev
    paths:
      - 'docs/diagrams/**.mmd'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install fonts for Japanese
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@10.0.0
      - name: Render diagrams
        run: |
          mkdir -p docs/diagrams/generated
          for f in docs/diagrams/*.mmd; do
            filename=$(basename "$f" .mmd)
            mmdc -i "$f" -o "docs/diagrams/generated/${filename}.svg"
          done
      - name: Upload generated diagrams
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: docs/diagrams/generated/*.svg
