name: Render documentation assets
on:
  push:
    branches:
      - dev
    paths:
      - 'docs/diagrams/**.mmd'
      - 'vite/src/lib/api.ts'
      - 'scripts/generate-api-docs.mjs'
      - 'package.json'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Install fonts for Japanese
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate API OpenAPI spec
        run: npm run render:docs
      - name: Render diagrams
        run: npm run render:diagrams
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-assets
          path: |
            docs/diagrams/generated/*.svg
            docs/api/openapi.yaml
